components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization ID
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      description: Requirement document ID
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      description: User ID
      schema: { type: string, format: uuid }
    JobRoleId:
      name: jobRoleId
      in: path
      required: true
      description: Job role ID
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Project ID
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      description: Task ID
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Zero-based page number
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Page size. Values above 100 are capped at 100.
      schema: { type: integer, minimum: 1, default: 20 }

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Member lacks the required permission
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource does not exist or is not accessible
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Stale version, duplicate value, or archived project
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Role:
      type: string
      enum: [OWNER, ADMIN, MEMBER, VIEWER]
    ProjectStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    TaskStatus:
      type: string
      enum: [BACKLOG, TODO, IN_PROGRESS, IN_REVIEW, DONE]
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]

    Me:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }

    Organization:
      type: object
      required: [id, name, slug, role, createdBy, createdAt, updatedAt, version, allowSelfApproval]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role:
          $ref: '#/components/schemas/Role'
          description: The current user's role in this organization
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        allowSelfApproval: { type: boolean }
    OrganizationSettingsPatch:
      type: object
      additionalProperties: false
      required: [allowSelfApproval, version]
      properties:
        allowSelfApproval: { type: boolean }
        version: { type: integer, format: int64 }
    OrganizationCreate:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    OrganizationPatch:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        version: { type: integer, format: int64 }

    Member:
      type: object
      required: [userId, email, displayName, role, version]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        version: { type: integer, format: int64 }
    MemberPatch:
      type: object
      additionalProperties: false
      required: [role, version]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        version: { type: integer, format: int64 }

    InviteRole:
      type: string
      enum: [ADMIN, MEMBER, VIEWER]
    Invite:
      type: object
      required: [id, email, role, status, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/InviteRole' }
        status: { type: string, enum: [PENDING, EXPIRED] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    CreatedInvite:
      allOf:
        - $ref: '#/components/schemas/Invite'
        - type: object
          required: [token]
          properties:
            token: { type: string }
    InviteCreate:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role: { $ref: '#/components/schemas/InviteRole' }
    InviteAccept:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1 }
    AcceptedInvite:
      type: object
      required: [organizationId]
      properties:
        organizationId: { type: string, format: uuid }

    JobRole:
      type: object
      required: [id, organizationId, name, active, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    JobRoleCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
    JobRolePatch:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        active: { type: boolean }
        version: { type: integer, format: int64 }

    ApprovalBasis:
      type: string
      enum: [ROLE_HOLDER, OWNER_FALLBACK]
    ProjectTeamMember:
      type: object
      required: [userId, email, displayName, role, jobRoleIds]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        jobRoleIds:
          type: array
          items: { type: string, format: uuid }
    ProjectTeamJobRole:
      type: object
      required: [id, name, active, approvalBasis]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        approvalBasis:
          $ref: '#/components/schemas/ApprovalBasis'
          description: Who approves this role's tasks on this project
    ProjectTeam:
      type: object
      required: [members, jobRoles]
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/ProjectTeamMember' }
        jobRoles:
          type: array
          items: { $ref: '#/components/schemas/ProjectTeamJobRole' }

    Project:
      type: object
      required: [id, organizationId, name, description, status, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 10000 }
    ProjectPatch:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 10000 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        version: { type: integer, format: int64 }

    Task:
      type: object
      required: [id, organizationId, projectId, title, description, status, priority, assigneeId, dueDate, responsibleJobRoleId, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        assigneeId: { type: [string, 'null'], format: uuid }
        dueDate: { type: [string, 'null'], format: date }
        responsibleJobRoleId:
          type: [string, 'null']
          format: uuid
          description: Null only for tasks created before job roles existed
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    TaskCreate:
      type: object
      additionalProperties: false
      required: [title, responsibleJobRoleId]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 10000 }
        status:
          $ref: '#/components/schemas/TaskStatus'
          default: BACKLOG
        priority:
          $ref: '#/components/schemas/TaskPriority'
          default: MEDIUM
        assigneeId: { type: [string, 'null'], format: uuid }
        dueDate: { type: [string, 'null'], format: date }
        responsibleJobRoleId:
          type: string
          format: uuid
          description: Must be an active job role. New tasks cannot start in IN_REVIEW or DONE.
    TaskPatch:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 10000 }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        assigneeId: { type: [string, 'null'], format: uuid }
        dueDate: { type: [string, 'null'], format: date }
        responsibleJobRoleId:
          type: string
          format: uuid
          description: Cannot be cleared once set, or changed while the task is in review
        version: { type: integer, format: int64 }

    TaskReviewRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int64 }
        comment:
          type: [string, 'null']
          maxLength: 2000
          description: Required and non-blank when rejecting

    TaskReviewAction:
      type: string
      enum: [SUBMITTED, APPROVED, REJECTED, WITHDRAWN, REOPENED]
    TaskReview:
      type: object
      required: [id, taskId, taskVersion, action, actorId, actorName, jobRoleId, jobRoleName, approvalBasis, selfApproved, comment, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        taskVersion: { type: integer, format: int64 }
        action: { $ref: '#/components/schemas/TaskReviewAction' }
        actorId: { type: string, format: uuid }
        actorName:
          type: [string, 'null']
          description: Null when the person is no longer a member
        jobRoleId: { type: string, format: uuid }
        jobRoleName: { type: string }
        approvalBasis:
          oneOf:
            - $ref: '#/components/schemas/ApprovalBasis'
            - type: 'null'
        selfApproved: { type: boolean }
        comment: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    ReviewQueueItem:
      type: object
      required: [task, projectName, jobRoleName, submittedBy, submittedByName, submittedAt, approvalBasis, selfApproval]
      properties:
        task: { $ref: '#/components/schemas/Task' }
        projectName: { type: string }
        jobRoleName: { type: string }
        submittedBy: { type: string, format: uuid }
        submittedByName:
          type: [string, 'null']
          description: Null when the person is no longer a member
        submittedAt: { type: string, format: date-time }
        approvalBasis: { $ref: '#/components/schemas/ApprovalBasis' }
        selfApproval: { type: boolean }

    AiRunAccepted:
      type: object
      required: [runId]
      properties:
        runId: { type: string, format: uuid }
    AiRun:
      type: object
      required: [id, documentId, runType, status, provider, model, promptVersion, inputTokens, outputTokens, billingTier, costUsd, errorCode, currentStep, createdAt, startedAt, finishedAt]
      properties:
        id: { type: string, format: uuid }
        documentId:
          type: [string, 'null']
          format: uuid
          description: Null for architecture runs, which belong to a project.
        runType: { type: string, enum: [ANALYSIS, STORIES, ARCHITECTURE] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
        provider: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        promptVersion: { type: [string, 'null'] }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        billingTier: { type: string, enum: [FREE, PAID] }
        costUsd: { type: number }
        errorCode: { type: [string, 'null'] }
        currentStep:
          type: [string, 'null']
          enum: [OVERVIEW, DATA_MODEL, API_DESIGN, null]
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    RequirementAnalysis:
      type: object
      required: [id, version, result, createdAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        result: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    ClarificationQuestion:
      type: object
      required: [id, position, question, reason, status, answer, version]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        question: { type: string }
        reason: { type: string }
        status: { type: string, enum: [OPEN, ANSWERED, DISMISSED] }
        answer: { type: [string, 'null'] }
        version: { type: integer, format: int64 }
    ClarificationUpdate:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ANSWERED, DISMISSED] }
        answer: { type: [string, 'null'], maxLength: 5000 }
        version: { type: integer, format: int64 }
    StorySourceQuote:
      type: object
      required: [quote, verified]
      properties:
        quote: { type: string }
        verified: { type: boolean }
    StoryDraft:
      type: object
      required: [id, documentId, analysisId, title, asA, iWant, soThat, acceptanceCriteria, priority, jobRoleId, sourceQuotes, status, taskId, generatedBy, createdAt, updatedAt, version, canReview]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        analysisId: { type: string, format: uuid }
        title: { type: string }
        asA: { type: string }
        iWant: { type: string }
        soThat: { type: string }
        acceptanceCriteria:
          type: array
          items: { type: string }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
        jobRoleId: { type: [string, 'null'], format: uuid }
        sourceQuotes:
          type: array
          items: { $ref: '#/components/schemas/StorySourceQuote' }
        status: { type: string, enum: [DRAFT, APPROVED, REJECTED, CONVERTED] }
        taskId: { type: [string, 'null'], format: uuid }
        generatedBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        canReview:
          type: boolean
          description: True when the signed-in user can approve or reject this story now.
    StoryDraftPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StoryDraft' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
    StoryUpdate:
      type: object
      required: [title, asA, iWant, soThat, acceptanceCriteria, priority, version]
      properties:
        title: { type: string, maxLength: 200 }
        asA: { type: string, maxLength: 300 }
        iWant: { type: string, maxLength: 1000 }
        soThat: { type: string, maxLength: 1000 }
        acceptanceCriteria:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, maxLength: 1000 }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
        jobRoleId: { type: [string, 'null'], format: uuid }
        version: { type: integer, format: int64 }
    StoryReview:
      type: object
      required: [id, storyVersion, action, actorId, approvalBasis, selfApproved, comment, createdAt]
      properties:
        id: { type: string, format: uuid }
        storyVersion: { type: integer, format: int64 }
        action: { type: string, enum: [SUBMITTED, APPROVED, REJECTED, REOPENED] }
        actorId: { type: string, format: uuid }
        approvalBasis:
          type: [string, 'null']
          enum: [ROLE_HOLDER, OWNER_FALLBACK, null]
        selfApproved: { type: boolean }
        comment: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    StoryReviewPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StoryReview' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
    ArchitectureVersionSummary:
      type: object
      required: [id, versionNumber, status, createdAt, generatedBy]
      properties:
        id: { type: string, format: uuid }
        versionNumber: { type: integer }
        status: { type: string, enum: [DRAFT, APPROVED, REJECTED, SUPERSEDED] }
        createdAt: { type: string, format: date-time }
        generatedBy: { type: [string, 'null'], format: uuid }
    ArchitectureVersionSummaryPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ArchitectureVersionSummary' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
    ArchitectureState:
      type: object
      required: [current, draft, latestRun]
      properties:
        current:
          anyOf:
            - $ref: '#/components/schemas/ArchitectureVersionSummary'
            - type: 'null'
        draft:
          anyOf:
            - $ref: '#/components/schemas/ArchitectureVersionSummary'
            - type: 'null'
        latestRun:
          anyOf:
            - $ref: '#/components/schemas/AiRun'
            - type: 'null'
    ArchitectureStoryLink:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [DRAFT, APPROVED, REJECTED, CONVERTED] }
    ArchitectureVersion:
      type: object
      required: [id, projectId, versionNumber, status, basedOnVersionId, approverJobRoleId, overview, dataModel, apiDesign, storyIds, stories, generatedBy, createdAt, updatedAt, version, canEdit, canReview]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        versionNumber: { type: integer }
        status: { type: string, enum: [DRAFT, APPROVED, REJECTED, SUPERSEDED] }
        basedOnVersionId: { type: [string, 'null'], format: uuid }
        approverJobRoleId: { type: [string, 'null'], format: uuid }
        overview:
          type: object
          additionalProperties: true
          description: Summary, components, techStack, decisions, and risks.
        dataModel:
          type: object
          additionalProperties: true
          description: Tables with columns, relations, and storyIds.
        apiDesign:
          type: object
          additionalProperties: true
          description: Endpoints with fields, roles, and storyIds.
        storyIds:
          type: array
          items: { type: string, format: uuid }
        stories:
          type: array
          items: { $ref: '#/components/schemas/ArchitectureStoryLink' }
        generatedBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        canEdit: { type: boolean }
        canReview: { type: boolean }
    ArchitectureSectionUpdate:
      type: object
      required: [content, version]
      properties:
        content: { type: object, additionalProperties: true }
        version: { type: integer, format: int64 }
    ArchitectureReview:
      type: object
      required: [id, contentVersion, action, actorId, approvalBasis, selfApproved, comment, createdAt]
      properties:
        id: { type: string, format: uuid }
        contentVersion: { type: integer, format: int64 }
        action: { type: string, enum: [APPROVED, REJECTED] }
        actorId: { type: string, format: uuid }
        approvalBasis: { type: string, enum: [ROLE_HOLDER, OWNER_FALLBACK] }
        selfApproved: { type: boolean }
        comment: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    ArchitectureReviewPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ArchitectureReview' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
    StoryApproval:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64 }
    StoryRejection:
      type: object
      required: [version, comment]
      properties:
        version: { type: integer, format: int64 }
        comment: { type: string, minLength: 1, maxLength: 2000 }
    CreateTasksResult:
      type: object
      required: [created]
      properties:
        created:
          type: array
          items:
            type: object
            required: [storyId, taskId]
            properties:
              storyId: { type: string, format: uuid }
              taskId: { type: string, format: uuid }
    RequirementAnalysisState:
      type: object
      required: [analysis, questions, latestRun, latestStoryRun]
      properties:
        analysis:
          anyOf:
            - $ref: '#/components/schemas/RequirementAnalysis'
            - type: 'null'
        questions:
          type: array
          items: { $ref: '#/components/schemas/ClarificationQuestion' }
        latestRun:
          anyOf:
            - $ref: '#/components/schemas/AiRun'
            - type: 'null'
        latestStoryRun:
          anyOf:
            - $ref: '#/components/schemas/AiRun'
            - type: 'null'
    RequirementDocument:
      type: object
      required: [id, organizationId, projectId, name, mediaType, sizeBytes, characters, approverJobRoleId, uploadedBy, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer }
        characters: { type: integer }
        approverJobRoleId: { type: [string, 'null'], format: uuid }
        uploadedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    RequirementUpload:
      type: object
      required: [file, dummyDataConfirmed]
      properties:
        file: { type: string, format: binary }
        dummyDataConfirmed:
          type: boolean
          description: Must be true. Phase 2 accepts dummy documents only.
        approverJobRoleId: { type: string, format: uuid }

    AuditEvent:
      type: object
      required: [id, organizationId, actorId, action, entityType, entityId, metadata, createdAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        metadata:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    PageMeta:
      type: object
      required: [page, size, totalItems]
      properties:
