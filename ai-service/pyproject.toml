[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-brain-ai-service"
version = "0.1.0"
description = "Stateless AI worker for Project Brain"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "python-multipart>=0.0.18,<1",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "google-genai>=1.40,<3",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "httpx>=0.27,<1",
  "reportlab>=4.2,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
