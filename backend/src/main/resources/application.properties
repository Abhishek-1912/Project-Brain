spring.application.name=project-brain-backend

# Runtime connection: restricted role, subject to row-level security.
spring.datasource.url=${DB_APP_URL}
spring.datasource.username=${DB_APP_USER}
spring.datasource.password=${DB_APP_PASSWORD}

# Migration connection: schema owner, used only by Flyway.
spring.flyway.url=${DB_MIGRATOR_URL}
spring.flyway.user=${DB_MIGRATOR_USER}
spring.flyway.password=${DB_MIGRATOR_PASSWORD}
spring.flyway.default-schema=brain
spring.flyway.schemas=brain
spring.flyway.create-schemas=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=brain
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
